name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: executor/package-lock.json
      - run: python -m pip install -e .
      - run: npm ci --prefix executor --ignore-scripts
      - run: python scripts/dev.py check
      - run: python scripts/dev.py test
      - run: python scripts/dev.py demo
      - run: sim-evaluate runtime/demo/tasks.jsonl

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-intelligent-minecraft"
version = "0.2.0"
description = "Evidence-driven Minecraft agent with Python planning and Mineflayer execution"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sim-agent = "sim_agent.app.cli:main"
sim-demo = "sim_agent.app.demo:main"
sim-evaluate = "sim_agent.evaluation.metrics:main"
sim-dashboard = "sim_agent.app.dashboard:main"

[tool.setuptools.package-data]
"sim_agent.memory" = ["migrations/*.sql"]
"sim_agent.app" = ["dashboard.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sim_agent*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIM · 运行诊断台</title>
<style>
:root{--bg:#f3f5f8;--ink:#17283b;--muted:#788699;--line:#e2e8ef;--green:#196c59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px}button:hover{background:#edf6f1}button:focus-visible,input:focus-visible{outline:2px solid #198c70}.top{display:flex;justify-content:space-between;align-items:center;padding:17px 25px;background:white;border-bottom:1px solid var(--line);gap:12px}.brand{display:flex;gap:12px;align-items:center}.logo{background:#173e35;color:#b8f3d5;border-radius:10px;padding:11px;font-weight:800}.brand strong{font-size:18px}.sub{font-size:12px;color:var(--muted)}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{border-radius:30px;background:#e7f2eb;padding:4px 10px;color:var(--green);font-size:12px}.layout{display:grid;grid-template-columns:270px minmax(390px,1fr) 390px;min-height:calc(100vh - 80px)}aside{padding:24px 16px;border-right:1px solid var(--line);background:#fafbfd}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px}.asidehead{display:flex;justify-content:space-between;margin-bottom:15px}.search{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.check{font-size:12px;color:var(--muted)}.traces{display:grid;gap:9px;margin-top:20px}.trace{text-align:left;width:100%;padding:12px}.trace.active{background:#eaf3ef;border-color:#83b7a5;box-shadow:inset 3px 0 #196c59}.trace strong{display:block;margin:7px 0;overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}main{padding:26px;min-width:0}h1{font-size:22px;margin:5px 0 8px;line-height:1.5}h2{font-size:14px;margin:0}.note{padding:11px 13px;background:#fff8e9;border:1px solid #ecddba;border-radius:8px;font-size:12px;color:#826326;margin:20px 0}.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{text-align:left;padding:11px;min-height:85px}.stage b{display:block;font-size:12px;margin:5px 0}.stage small{font-size:10px;color:var(--muted)}.stage.sel{border-color:#196c59;box-shadow:0 0 0 1px #196c59}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#bec7d2}.ok .dot{background:#2c966d}.start .dot{background:#548ecd}.error .dot,.blocked .dot{background:#c24d58}.badge{font-size:11px;border-radius:5px;padding:3px 7px;background:#edf0f4;color:#69768b}.badge.error{background:#faeaec;color:#b33b46}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:20px;overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:13px 16px}.comparison{padding:15px;display:grid;gap:12px}.label{color:var(--muted);font-size:11px}.value{font-size:13px;overflow-wrap:anywhere}.events{padding:6px 15px}.event{display:grid;grid-template-columns:58px 12px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid #eff2f6;cursor:pointer}.event:hover,.event.selected{background:#f2f7f4}.event time{font:10px/1.9 Consolas,monospace;color:var(--muted)}.event b{font-size:12px}.event .sub{font-size:11px}.detail{background:white;border-left:1px solid var(--line);padding:25px 18px;min-width:0}.detail h2{margin:15px 0 5px}.detail pre{background:#142133;color:#d4e5e7;border-radius:9px;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.8 Consolas,"Microsoft YaHei",monospace;max-height:calc(100vh - 245px);overflow:auto}.detailhead{display:flex;justify-content:space-between;align-items:center}.empty{text-align:center;color:var(--muted);padding:32px 10px}.footer{font-size:11px;color:var(--muted);margin:24px 0}.small{font-size:11px;padding:4px 8px}@media(min-width:1650px){.layout{grid-template-columns:300px 1fr 460px}}@media(max-width:1150px){.layout{grid-template-columns:245px 1fr}.detail{grid-column:2;border-top:1px solid var(--line)}.detail pre{max-height:450px}}@media(max-width:700px){.layout{display:block}.top{padding:12px;align-items:flex-start}.brand .sub{display:none}.tools{justify-content:flex-end}.tools button{font-size:11px}.traces{max-height:200px;overflow:auto}main{padding:16px}.pipeline{grid-template-columns:repeat(2,1fr)}.detail{border-left:0}}
</style>
<header class="top"><div class="brand"><div class="logo">SIM</div><div><strong>运行诊断台</strong><div class="sub">从玩家原话，追到实际执行的每一步</div></div></div><div class="tools"><span class="pill" id="connection">连接中</span><button id="pause">暂停刷新</button><button id="demo">查看演示</button><button id="live" hidden>返回实时</button><button id="import">导入记录</button><button id="export">导出</button><input type="file" id="file" accept=".json,.jsonl" hidden></div></header>
<div class="layout"><aside><div class="asidehead"><div class="eyebrow">指令记录</div><span class="badge" id="total">0</span></div><input class="search" id="search" placeholder="搜索玩家或指令" aria-label="搜索玩家或指令"><label class="check"><input type="checkbox" id="issues">仅显示程序报错或阻断</label><div class="traces" id="traces"></div><div class="footer">本地只读 · 不向游戏发送指令<br>模型输出与日志可能已脱敏或截断</div></aside><main><div class="eyebrow">COMMAND / TRACE</div><h1 id="headline">等待第一条玩家指令</h1><div class="sub" id="traceinfo">启动伙伴后，在游戏中发出指令即可查看。</div><div class="note" id="notice">程序校验通过，只代表结构与权限合法。请对照原始指令检查模型是否选对技能；本面板不自动判定语义正确。</div><div class="pipeline" id="pipeline"></div><div class="panel"><div class="panelhead"><h2>指令与执行对照</h2><span class="sub">先看模型选择，再看实际入队</span></div><div class="comparison" id="comparison"></div></div><div class="panel"><div class="panelhead"><h2>事件时间线</h2><button class="small" id="all">全部环节</button></div><div class="events" id="events"></div></div><div class="footer" id="storage"></div></main><section class="detail"><div class="detailhead"><div class="eyebrow">事件详情 / EVIDENCE</div><button class="small" id="copy">复制 JSON</button></div><h2 id="detailtitle">选择一个事件</h2><div class="sub" id="detailinfo">点击环节或时间线，查看输入、返回、拒绝码和证据。</div><pre id="json">{ "status": "等待事件" }</pre></section></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=[['input','玩家输入'],['model','模型决策'],['validation','程序校验'],['dispatch','交互分发'],['scheduler','任务调度'],['controller','步骤执行'],['observation','观测查询'],['action','底层动作'],['feedback','验收反馈'],['reply','玩家回复'],['runtime','连接/运行时']],states={start:'进行中',ok:'程序已完成',error:'程序报错',blocked:'程序阻断',cancelled:'已取消',info:'记录'};
const stateLabel=e=>e.state==='ok'?({model:'已返回 · 需核对',validation:'规则通过 · 语义待核对',scheduler:'已处理',controller:'步骤已返回',action:'动作已返回',feedback:'本任务已验收'}[e.stage]||states[e.state]):(states[e.state]||e.state);
let records=[],selected=null,eventSeq=null,stage=null,cursor=0,paused=false,mode='live',lastJson='';const time=t=>new Date(t).toLocaleTimeString('zh-CN',{hour12:false}),fail=e=>['error','blocked'].includes(e.state),input=es=>es.find(e=>e.stage==='input')?.data||{text:'运行时事件',player:'系统'};
function groups(){const map=new Map;for(const e of records){if(!map.has(e.traceId))map.set(e.traceId,[]);map.get(e.traceId).push(e)}return [...map].reverse()}
function choice(e){const d=e?.data;return d?.kind==='skill'?d.skill+' '+JSON.stringify(d.params):d?.kind==='operations'?d.operations.map(o=>o.type).join(' → '):d?.kind==='plan'?d.steps?.map(o=>o.skill).join(' → '):d?.kind||''}
function detail(){const e=records.find(e=>e.seq===eventSeq&&e.traceId===selected);if(!e){lastJson='{}';$('detailtitle').textContent='选择一个事件';$('detailinfo').textContent='点击环节或时间线查看证据';$('json').textContent='{}';return}lastJson=JSON.stringify(e,null,2);$('detailtitle').textContent=e.label;$('detailinfo').textContent=time(e.at)+' · '+(stateLabel(e))+(e.taskId?' · '+e.taskId:'');$('json').textContent=lastJson}
function render(){const gs=groups().filter(([id,es])=>(!$('issues').checked||es.some(fail))&&JSON.stringify(input(es)).toLowerCase().includes($('search').value.toLowerCase()));if(!selected||!gs.some(([id])=>id===selected))selected=gs[0]?.[0]||null;$('total').textContent=gs.length;
$('traces').innerHTML=gs.length?gs.map(([id,es])=>{const i=input(es),f=es.some(fail);return '<button class="trace '+(id===selected?'active':'')+'" data-trace="'+esc(id)+'"><div class="meta"><span>'+esc(i.player)+'</span><span>'+time(es[0].at)+'</span></div><strong>'+esc(i.text)+'</strong><span class="badge '+(f?'error':'')+'">'+(f?'存在报错 / 阻断':'查看执行过程')+'</span></button>'}).join(''):'<div class="empty">◇<br>暂无匹配记录<br>可查看演示了解界面</div>';
const es=records.filter(e=>e.traceId===selected),i=input(es),failure=es.findLast(fail);$('headline').textContent=es.length?i.text:'等待第一条玩家指令';$('traceinfo').textContent=es.length?i.player+' · '+selected+' · '+es.length+' 条事件':'启动伙伴后，在游戏中发出指令即可查看。';
$('pipeline').innerHTML=stages.map(([key,label],n)=>{const list=es.filter(e=>e.stage===key),e=list.findLast(fail)||list.at(-1);return '<button class="stage '+esc(e?.state||'')+' '+(stage===key?'sel':'')+'" data-stage="'+key+'"><span class="dot"></span><small> '+String(n+1).padStart(2,'0')+'</small><b>'+label+'</b><small>'+(e?(stateLabel(e))+' · '+list.length+'条':'无记录')+'</small></button>'}).join('');
const parsed=es.filter(e=>e.stage==='validation'&&e.state==='info'&&e.data?.kind).at(-1),queued=es.filter(e=>e.stage==='scheduler'&&e.data?.task).map(e=>e.data.task.steps.map(s=>s.skill?.id||s.actions?.map(a=>a.operation?.type||a.type).join(' → ')).join(' → '));const rows=[['玩家原话',i.text],['模型选择（语义需核对）',choice(parsed)||'尚无结构化决定'],['实际入队步骤',queued.join(' / ')||'没有任务入队记录'],['最后程序报错 / 阻断',failure?failure.label+' · '+(failure.data?.code||failure.data?.reason||failure.data?.error?.code||'点击查看详情'):'未记录到程序异常；这不证明理解正确']];$('comparison').innerHTML=rows.map(([l,v])=>'<div><div class="label">'+l+'</div><div class="value">'+esc(v)+'</div></div>').join('');
const events=es.filter(e=>!stage||e.stage===stage);if(eventSeq==null||!es.some(e=>e.seq===eventSeq))eventSeq=(failure||es.at(-1))?.seq;$('events').innerHTML=events.length?events.map(e=>'<div tabindex="0" role="button" class="event '+esc(e.state)+' '+(eventSeq===e.seq?'selected':'')+'" data-event="'+e.seq+'"><time>'+time(e.at)+'</time><div><span class="dot"></span></div><div><b>'+esc(e.label)+'</b><div class="sub">'+esc(stages.find(s=>s[0]===e.stage)?.[1]||e.stage)+' · '+esc(stateLabel(e))+(e.durationMs!=null?' · '+e.durationMs+'ms':'')+'</div></div></div>').join(''):'<div class="empty">没有此环节记录；可能尚未到达，或此路径不经过它。</div>';detail();
document.querySelectorAll('[data-trace]').forEach(b=>b.onclick=()=>{selected=b.dataset.trace;eventSeq=null;stage=null;render()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;eventSeq=es.findLast(e=>e.stage===stage)?.seq;render()});document.querySelectorAll('[data-event]').forEach(b=>{b.onclick=()=>{eventSeq=Number(b.dataset.event);render()};b.onkeydown=e=>{if(e.key==='Enter')b.click()}})}
async function poll(){if(paused||mode!=='live')return;try{const r=await fetch('/api/events?after='+cursor);if(!r.ok)throw Error(r.status);const d=await r.json();const known=new Set(records.map(e=>e.seq));records.push(...d.events.filter(e=>!known.has(e.seq)));records=records.slice(-2000);cursor=d.lastSeq;$('connection').textContent='● 本机实时';$('storage').textContent=d.storageNote||'最多保留2000条内存事件；完整已脱敏记录保存在本地 JSONL 日志。';render()}catch{$('connection').textContent='连接中断 · 自动重试'}}
$('search').oninput=render;$('issues').onchange=render;$('all').onclick=()=>{stage=null;render()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续刷新':'暂停刷新';if(!paused)poll()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastJson);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制 JSON',1000)}catch{$('copy').textContent='请从详情框选择复制'}};
$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({mode,events:records},null,2)],{type:'application/json'}));a.download='sim-diagnostics-'+mode+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024){alert('文件超过20MB，请先拆分');return}try{const text=await f.text();let d;try{d=JSON.parse(text)}catch{d={events:text.split('\n').filter(Boolean).map(line=>JSON.parse(line))}}if(!Array.isArray(d.events))throw Error();records=d.events.filter(e=>typeof e.traceId==='string'&&Number.isFinite(e.seq)&&Number.isFinite(e.at)&&typeof e.stage==='string').slice(-2000);mode='import';selected=null;eventSeq=null;$('connection').textContent='离线导入';$('live').hidden=false;$('notice').textContent='离线导入记录：不会向运行时提交操作，导出前请核对其中的信息。';render()}catch{alert('请选择有效的诊断 JSON 或 JSONL 文件')}};
$('live').onclick=()=>{mode='live';records=[];cursor=0;selected=null;eventSeq=null;stage=null;$('live').hidden=true;$('notice').textContent='程序校验通过，只代表结构与权限合法。请对照原始指令核对模型选择。';poll()};
$('demo').onclick=()=>{mode='demo';selected=null;eventSeq=null;stage=null;records=[];const now=Date.now();const add=(traceId,stage,state,label,data)=>records.push({seq:records.length+1,sessionId:'demo',traceId,at:now+records.length*150,stage,state,label,data});add('demo-navigation','input','info','玩家原始指令',{player:'示例玩家',text:'到离我最近的树那里去'});add('demo-navigation','model','ok','模型原始返回（演示）',{text:'{"kind":"skill","skill":"find_resource"}'});add('demo-navigation','validation','info','解析后的决定（需核对意图）',{kind:'skill',skill:'find_resource',params:{names:['spruce_log']}});add('demo-navigation','scheduler','ok','任务已入队',{task:{goal:'find_resource',steps:[{skill:{id:'find_resource'}}]}});add('demo-navigation','feedback','ok','本次任务验收（不是玩家总目标验收）',{sourceText:'到离我最近的树那里去',taskGoal:'find_resource',feedback:{outcome:'completed',verified:true}});add('demo-navigation','dispatch','blocked','后续任务被程序阻止',{code:'CONTINUATION_DENIED',reason:'这个目标已经完成；如果要继续，直接告诉我新的目标。',proposedTask:{goal:'导航到树旁'}});add('demo-pickup','input','info','玩家原始指令',{player:'示例玩家',text:'捡一下木头'});add('demo-pickup','model','ok','模型原始返回（演示）',{text:'{"kind":"skill","skill":"gather_wood","params":{"count":8}}'});add('demo-pickup','validation','info','解析后的决定（需核对意图）',{kind:'skill',skill:'gather_wood',params:{count:8}});add('demo-pickup','validation','ok','结构与权限校验通过（不等于语义正确）',{kind:'task'});add('demo-pickup','scheduler','ok','任务已入队',{task:{goal:'gather_wood',steps:[{skill:{id:'gather_wood'}}]}});$('connection').textContent='演示模式';$('live').hidden=false;$('notice').textContent='演示数据：按截图问题构造的示例，不是真实模型日志，没有连接或操作机器人。';render()};render();poll();setInterval(poll,1200);
</script></html>
